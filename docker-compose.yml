name: komify

services:
  postgres_dev:
    image: postgres:16
    container_name: dev
    restart: unless-stopped
    env_file:
      - ../backend/.env.dev
    ports:
      - "6010:5432"
    volumes:
      - ./data/postgres_dev:/var/lib/postgresql/data
    networks:
      - komify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  postgres_prod:
    image: postgres:16
    container_name: prod
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "6011:5432"
    volumes:
      - ./data/postgres_prod:/var/lib/postgresql/data
    networks:
      - komify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: ../scraper
      dockerfile: Dockerfile
    container_name: scraper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_DEV_URL=http://docker.internal
      - BACKEND_PROD_URL=http://docker.internal
      - ENV=development
    networks:
      - komify
    depends_on:
      postgres_dev:
        condition: service_healthy

networks:
  komify:
    driver: bridge
    name: komify
